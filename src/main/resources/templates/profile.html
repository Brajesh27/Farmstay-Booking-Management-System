<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="navbar">
    <a href="/" class="logo">🌿 Green Valley</a>
    <a href="/" class="btn btn-light">← Home</a>
</header>

<main class="container narrow">
    <div class="panel">
        <h1>My Profile</h1>
        <p class="subtitle">Manage your personal information.</p>

        <p class="message success" th:if="${message}" th:text="${message}"></p>
        <p class="message error" th:if="${error}" th:text="${error}"></p>

        <h2>Personal Details</h2>
        <p>Username: <b th:text="${currentUser.username}"></b></p>

        <form action="/profile" method="post">
            <label>Full Name</label>
            <input name="name" th:value="${currentUser.name}" required>

            <label>Phone Number</label>
            <input name="phone" th:value="${currentUser.phone}" required
                   pattern="[0-9]{10}" maxlength="10" inputmode="numeric"
                   title="Phone number must be exactly 10 digits (numbers only)">

            <button class="btn" type="submit">Save Details</button>
        </form>
    </div>

    <div class="panel">
        <h2>Change Password</h2>

        <form action="/change-password" method="post">
            <label>Current Password</label>
            <input name="oldPassword" type="password" required>

            <label>New Password</label>
            <input name="newPassword" type="password" required
                   minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                   title="At least 8 characters, with a letter, a number and a special character">
            <small>At least 8 characters, with a letter, a number and a special character.</small>

            <button class="btn" type="submit">Change Password</button>
        </form>
    </div>
</main>

</body>
</html>
